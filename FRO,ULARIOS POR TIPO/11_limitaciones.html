<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontawesome/7.3.1/css/all.min.css">
<!-- Enlace a la hoja de estilos de Font Awesome para poder usar iconos (<i class="fa ...">) -->
</head>
<body>
<h2>Formulario con limitaciones</h2>
<form action="" method="post">
Ingresa tu nombre:
<!-- Desahbilitacion de campo -->
<!-- disabled: el campo se ve gris, no se puede editar y no se envia al servidor -->
<input type="text" name="nombre" disabled><br>
<!-- Limitacion de caracteres -->
Contraseña:
<!-- maxlength="5": solo permite escribir hasta 5 caracteres -->
<input type="password" name="pass" maxlength="5"><br>
<!-- Solo lectura -->
Comentarios:
<!-- readonly: el texto se puede ver y seleccionar, pero no modificar (a diferencia de disabled, si se envia) -->
<textarea name="comentarios" readonly>Este es mi comentario y no se puede borrar
</textarea><br>
</form>
</body>
</html>
