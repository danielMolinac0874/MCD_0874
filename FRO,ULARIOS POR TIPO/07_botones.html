<!DOCTYPE html>
<html lang="es">
<head>
<!--permite acentos y la letra ñ -->
<meta charset="UTF-8">
<!--adapte a celulares -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario con botones</title>
<!-- Libreria de iconos Font Awesome (necesita internet) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<h1>Formulario con botones</h1>
<!-- <form> indica formulario 
     action="" -> URL del script del servidor que recibe los datos (vacio = misma pagina)
     method="post" -> envia los datos ocultos dentro de la peticion (get los pondria en la URL). -->
<form action="" method="post">
  Ingresa tu nombre:
  <input type="text" name="nombre">
  <br>
  <!-- <button type="submit">: boton que envia el formulario.
       A diferencia de <input>, puede contener texto e iconos dentro. -->
  <button type="submit">
    Enviar
    <!-- <i> con clases de Font Awesome muestra un icono de avion de papel -->
    <i class="fa-regular fa-paper-plane"></i>
  </button>
  <!-- <button type="reset">: limpia el formulario. Icono de bote de basura -->
  <button type="reset">
    Borrar <i class="fa fa-trash"></i>
  </button>
</form>
</body>
</html>
