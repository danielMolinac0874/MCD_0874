<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontawesome/7.3.1/css/all.min.css">
<!-- Enlace a la hoja de estilos de Font Awesome para poder usar iconos (<i class="fa ...">) -->
</head>
<body>
<h2>Formularios con agrupamiento</h2>
<!-- <form> indica formulario 
     action="" -> URL del script del servidor que recibe los datos (vacio = misma pagina)
     method="post" -> envia los datos ocultos dentro de la peticion (get los pondria en la URL). -->
<form action="" method="post">
<!-- fieldset: dibuja un recuadro que agrupa campos relacionados -->
<fieldset>
<!-- legend: titulo del grupo, aparece sobre el borde del recuadro -->
<legend>Datos personales</legend>
Nombre y apellido:
<input type="text" name="nombre_apellido"><br>
Documento valido:
<input type="file" name="documento"><br>
<!-- type="date": selector de fecha con calendario -->
Fecha de nacimiento:<input type="date" name="fecha_nacimiento">
</fieldset>
<!-- Segundo grupo de campos -->
<fieldset>
<legend>Datos de estudio:</legend>
Nombre de la escuela:
<input type="text" name="escuela"><br>
Certificado valido:
<input type="file" name="certificado"><br>
Fecha de egreso:
<input type="date" name="fecha_egreso">
</fieldset>
<br>
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
<button type="reset">Borrar <i class="fa fa-trash"></i></button>
</form>
</body>
</html>
